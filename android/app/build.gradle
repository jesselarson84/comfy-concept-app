plugins {
    id 'com.android.application'
}

android {
    namespace = 'app.jesse.comfyconcept'
    // 37 = the SDK platform installed on the PC (android-37.0); targetSdk stays 35.
    compileSdk = 37

    defaultConfig {
        applicationId = 'app.jesse.comfyconcept'
        minSdk = 26
        targetSdk = 35
        versionCode = 3
        versionName = '1.0'
    }

    buildTypes {
        release {
            // ProGuard/R8 off: the app is tiny and the JS bridge relies on method names.
            minifyEnabled = false
            shrinkResources = false
            // Signed with the debug key so a release APK can be sideloaded without
            // setting up a keystore. Replace with your own signingConfig to publish.
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        // Lint warnings should never block a local build of this personal app.
        abortOnError = false
        checkReleaseBuilds = false
    }
}

// No dependencies: framework APIs only.
