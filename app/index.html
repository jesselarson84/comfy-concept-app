<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets us use env(safe-area-inset-*) around notches -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#171718">
  <title>Comfy UI</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/icons.css">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <!-- Workflow picker: ComfyUI's right-click "AI Workflow" menu (3D / Image / Video / Audio) plus My presets -->
      <button id="preset-btn" class="btn picker" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Workflow preset">
        <i class="i i-workflow"></i><span class="crumb" id="preset-crumb"></span><span class="name" id="preset-name">Loading&hellip;</span><i class="i i-chevron-down"></i>
      </button>
      <!-- Save as preset (node view only): the canvas graph into a picker section (ui/save-preset.js) -->
      <button id="btn-save-graph" class="btn save-graph" type="button" aria-label="Save as preset" title="Save as preset"><i class="i i-save"></i><span>Save preset</span></button>
      <!-- Node view toggle: ComfyUI's graph in the app (ui/node-view.js); pressed = node view shown -->
      <button id="btn-canvas" class="btn icon toggle-btn" type="button" aria-pressed="false" aria-controls="node-view" aria-label="Node view (ComfyUI canvas)" title="Node view (ComfyUI canvas)"><i class="i i-nodes"></i></button>
      <!-- Files toggle (batch 5 History; batch 13 renamed it Files): like the node view, it swaps what is under the top bar -->
      <button id="btn-history" class="btn icon toggle-btn" type="button" aria-pressed="false" aria-controls="history-host" aria-label="Files" title="Files"><i class="i i-folder"></i></button>
      <!-- Batch 16: Settings (Claude: on/off, API key on the PC, monthly limit, default model; ui/settings-sheet.js) -->
      <button id="btn-settings" class="btn icon" type="button" aria-label="Settings" title="Settings"><i class="i i-settings"></i></button>
    </header>
    <section id="history-host" class="history-host" aria-label="Files" hidden></section>
    <div id="picker" class="picker-pop" role="listbox" aria-label="Workflow presets" hidden></div>
    <div id="picker-scrim" class="picker-scrim" hidden></div>
    <div id="banner" class="banner" hidden></div>
    <!-- ComfyUI's own page in an iframe, created on the first toggle and then only hidden/shown -->
    <section id="node-view" class="node-view" aria-label="ComfyUI node view" hidden></section>

    <section id="panel" class="panel">
      <!-- Batch 12: "PC is running ..." with Open here (ui/pc-card.js) -->
      <div id="pc-card" class="pc-card" hidden></div>
      <!-- Batch 13: "Editing batch job 2 · Cancel" while a batch job is loaded into the form -->
      <div id="edit-bar" class="edit-bar" hidden></div>
      <!-- Batch 11: the project new outputs are filed into on Drive (ui/projects.js) -->
      <div id="project-row" class="project-row" hidden></div>
      <div id="preset-msg" class="msg" hidden></div>
      <label class="field prompt-field">
        <span class="label"><span>Prompt</span></span>
        <!-- Batch 8: + attaches a photo, video, recording or file (it replaced the top bar's Import button; ui/import-sheet.js) -->
        <span class="prompt-box">
          <textarea id="prompt" rows="5" placeholder="Describe the concept&hellip;" enterkeyhint="done"></textarea>
          <button id="btn-attach" class="btn icon attach-btn" type="button" aria-label="Attach a photo, video, recording or file" title="Attach"><i class="i i-plus"></i></button>
        </span>
      </label>
      <div id="neg-row" class="field inline" hidden>
        <label class="switch"><input type="checkbox" id="neg-toggle"> <span>Negative prompt</span></label>
      </div>
      <textarea id="negative" rows="2" placeholder="What to avoid&hellip;" hidden></textarea>
      <!-- Batch 16: the Claude box (ui/claude.js), only when Use Claude is on in Settings -->
      <div id="claude-host" class="claude-host" hidden></div>

      <div id="refs" class="refs" hidden></div>
      <div id="file-inputs" class="refs" hidden></div>
      <div id="mask-slot" class="refs" hidden></div>

      <div id="strength-field" class="field" hidden>
        <span class="label"><span>Strength</span><output id="strength-out" class="val"></output></span>
        <input type="range" id="strength" min="0.05" max="1" step="0.05">
      </div>

      <div id="params-open" class="params" hidden></div>

      <div class="quick">
        <div id="aspect-field" class="ctl" hidden>
          <span class="label"><span>Aspect</span><span id="aspect-size" class="val"></span></span>
          <div class="aspect-row">
            <!-- Batch 8: one button that opens a grid of ratios (both orientations) with a preview shape (ui/prompt-panel.js) -->
            <div class="aspect-pick">
              <button id="aspect-btn" class="ratio-select aspect-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Aspect ratio">
                <i id="aspect-shape" class="ar-shape" aria-hidden="true"></i><span id="aspect-label">1:1</span>
                <i class="i i-chevron-down" aria-hidden="true"></i>
              </button>
              <div id="aspect-pop" class="aspect-pop" role="dialog" aria-label="Aspect ratio" hidden></div>
            </div>
            <!-- Resolution (batch 5): long side 1K / 2K; 4K = 2K render + 2x upscale. Hidden where it does not apply.
                 Batch 15: the app's own dropdown (ui/dropdown.js), filled by ui/prompt-panel.js. -->
            <div id="res-select" class="res-select" hidden></div>
          </div>
        </div>
        <div id="batch-field" class="ctl">
          <span class="label"><span>Batch</span></span>
          <div class="stepper fill">
            <button id="batch-minus" class="btn icon" type="button" aria-label="Fewer"><i class="i i-minus"></i></button>
            <input id="batch" class="num" type="number" min="1" max="20" inputmode="numeric" aria-label="Batch count">
            <button id="batch-plus" class="btn icon" type="button" aria-label="More"><i class="i i-plus"></i></button>
          </div>
        </div>
        <div id="seed-field" class="ctl" hidden>
          <span class="label"><span>Seed</span></span>
          <div class="seed full">
            <label class="switch toggle icon-only" title="Lock seed"><input type="checkbox" id="seed-lock" aria-label="Lock seed"> <i class="i i-lock"></i></label>
            <input id="seed" class="seed-val" type="number" min="0" inputmode="numeric" aria-label="Seed">
            <button id="seed-dice" class="btn icon" type="button" aria-label="New random seed"><i class="i i-shuffle"></i></button>
          </div>
        </div>
      </div>

      <details id="settings" class="settings" hidden>
        <summary><i class="i i-settings" aria-hidden="true"></i><span>Settings</span><i class="i i-chevron-down chev" aria-hidden="true"></i></summary>
        <div id="params" class="sgrid"></div>
      </details>
    </section>

    <section id="results" class="results empty">
      <div class="results-head">
        <span>This session <span id="results-count" class="muted"></span></span>
        <button id="btn-clear" class="link">clear finished</button>
      </div>
      <div id="thumbs" class="thumbs"></div>
    </section>

    <footer class="actionbar">
      <button id="btn-cancel" class="btn danger" hidden>Cancel queue</button>
      <button id="btn-generate" class="btn primary run" type="button"><i class="i i-play"></i><span id="run-label">Run</span></button>
      <!-- Batch 13: one group on the right: + saves the form to the batch, the stack opens it (count always shown) -->
      <span class="batch-grp">
        <button id="btn-batch-add" class="btn icon batch-add" type="button" aria-label="Save to batch" title="Save to batch"><i class="i i-plus"></i></button>
        <button id="btn-batch" class="btn batch-btn" type="button" aria-label="Batch" title="Batch"><i class="i i-layers"></i><span id="batch-count" class="batch-count">0</span></button>
      </span>
      <!-- Batch 13: editing a batch job swaps Run + the batch group for these -->
      <button id="btn-edit-cancel" class="btn edit-cancel" type="button" hidden>Cancel</button>
      <button id="btn-edit-update" class="btn edit-update" type="button" hidden><i class="i i-check"></i><span id="edit-update-label">Update job</span></button>
    </footer>
  </div>
</body>
</html>
